# Minimal local Supabase config for snap-grade ($0 Docker path).
# Start: npx supabase start
# Stop:  npx supabase stop

project_id = "snap-grade"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
